name: Update Discord Status

on:
  push:
    branches:
      - main

jobs:
  discord-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Edit Discord Status Message
        run: |
          # 1. Get the current UNIX timestamp
          TIMESTAMP=$(date +%s)
          
          # 2. Extract commit details (Plain text, no emojis)
          # 'head -n 1' ensures we only get the first line of the commit message
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          AUTHOR="${{ github.event.head_commit.author.username }}"
          
          # 3. Construct the Payload
          # We format it exactly as requested: Plain text, Header for timestamp
          PAYLOAD=$(cat <<EOF
          {
            "content": "Project Status Update\n\nRepository: blairtcg/sumi\nLast development: ## <t:${TIMESTAMP}:R>\nLatest commit: #${COMMIT_SHA} by ${AUTHOR}\nCommit message: ${COMMIT_MSG}"
          }
          EOF
          )
          
          # 4. Send PATCH request to EDIT the existing message
          # We append /messages/ID to the webhook URL to target the specific message
          curl -H "Content-Type: application/json" \
               -X PATCH \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}/messages/${{ secrets.DISCORD_MESSAGE_ID }}"
