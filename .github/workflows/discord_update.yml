name: Update Discord Status

on:
  push:
    branches:
      - main

jobs:
  discord-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Edit Discord Status Message
        run: |
          # Calculate the fresh UNIX timestamp at the exact moment of execution
          TIMESTAMP=$(date +%s)
          
          # Extract the commit details dynamically
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          AUTHOR="${{ github.event.head_commit.author.username }}"
          
          # Construct the clean, emoji-free plain text layout
          PAYLOAD=$(cat <<EOF
          {
            "content": "Project Status Update\n\nRepository: blairtcg/sumi\nLast development: ## <t:${TIMESTAMP}:R>\nLatest commit: #${COMMIT_SHA} by ${AUTHOR}\nCommit message: ${COMMIT_MSG}"
          }
          EOF
          )
          
          # Execute the PATCH request to overwrite the exact same Discord message
          curl -H "Content-Type: application/json" \
               -X PATCH \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}/messages/${{ secrets.DISCORD_MESSAGE_ID }}"
