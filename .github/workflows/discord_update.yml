name: Initialize Discord Message

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to click "Run" manually in GitHub Actions tab

jobs:
  discord-init:
    runs-on: ubuntu-latest
    steps:
      - name: Send Initial Message
        run: |
          # 1. Create the JSON payload
          # We use a simple placeholder text to establish the message
          PAYLOAD=$(cat <<EOF
          {
            "content": "Project Status Update\n\nRepository: blairtcg/sumi\nWaiting for first status sync..."
          }
          EOF
          )
          
          # 2. Send POST request to create a NEW message
          # This URL comes from your DISCORD_WEBHOOK secret
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}"
